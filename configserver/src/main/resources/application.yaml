spring:
  application:
    name: configserver
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:///E:\Downloads\ecom_micro\configserver\src\main\resources\config
server:
  port: 8888

#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672 }
    username: ${RABBITMQ_USERNAME:guest }
    password: ${RABBITMQ_PASSWORD:guest}
    virtual_host: ${RABBITMQ_USERNAME:guest }
    connection_timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: "*"